name: SkyOS ET5 APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare Project & Assemble Debug APK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;35.0.0" || true

          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Unzipping $ZIP_FILE..."
              unzip -q -o "$ZIP_FILE" -d .
            fi
          fi

          GRAD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$GRAD_FILE" ]; then
            echo "HATA: Lutfen SkyOS-ET5-v2.82-Online-Build-Ready.zip dosyasini depoya yukleyin!"
            exit 1
          fi

          PROJ_DIR=$(dirname "$GRAD_FILE")
          cd "$PROJ_DIR"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-ET5-v2.82-Debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
